<div class="legend-box">

  <!-- Stat -->
  <div style="margin-bottom: 10px;">
    <label>Show Stat:</label>
    <select [(ngModel)]="selectedStat" (change)="onStatChange()">
      <option value="" disabled selected>-- Select --</option>
      <option value="min">Min</option>
      <option value="max">Max</option>
      <option value="mean">Mean</option>
    </select>
  </div>

  <!-- Field -->
  <label>Select Field:</label>
  <select [(ngModel)]="selectedField" (change)="onFieldChange()">
    <option value="" disabled selected>-- Select Field --</option>
    <option value="price">Price</option>
    <option value="rating">Rating</option>
    <option value="value">Value</option>
    <option value="height">Height</option>
  </select>

  <!-- Stats -->
  <div class="stats-container">

    <div class="selection-box" *ngIf="minMaxData && lastClickedHex">

      <h4>Selected Hex</h4>

      <div>
        <b>{{ selectedField }}:</b>
        {{ minMaxData.value }}
      </div>
<!-- 
      <div style="font-size:10px; color:#666;">
        ID: {{ minMaxData.hex_id }}
      </div> -->

    </div>

  </div>
  <!-- Path mode toggle -->
<div style="border-bottom: 1px solid #ddd; padding-bottom: 12px; margin-bottom: 12px;">

  <!-- Toggle button -->
  <button
    (click)="togglePathMode()"
    [style.background]="pathModeActive ? '#ff6600' : '#555'"
    style="width:100%; color:white; border:none; border-radius:6px;
           padding:8px; cursor:pointer; font-size:13px; font-weight:600;">
     {{ pathModeActive ? 'Path Mode ON — Click to Exit' : 'Draw Path Between Points' }}
  </button>

  <!-- Status message -->
  <div *ngIf="pathModeActive" style="margin-top:8px; font-size:12px; color:#ff6600; font-weight:500;">
    {{ pathStatus }}
  </div>

  <!-- Results -->
  <div *ngIf="pathDistance !== null"
       style="margin-top:10px; background:#f9f9f9; border-radius:6px;
              padding:10px; font-size:12px; border:1px solid #eee;">

    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span style="color:#888;">Grid Distance</span>
      <strong style="color:#ff6600;">{{ pathDistance }} hops</strong>
    </div>

    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span style="color:#888;">Path Cells</span>
      <strong>{{ pathSteps! + 1 }} hexes</strong>
    </div>

    <div style="font-size:10px; color:#aaa; margin-top:6px; word-break:break-all;">
      <div>From: {{ pathHex1 }}</div>
      <div>To: &nbsp;&nbsp;{{ pathHex2 }}</div>
    </div>

    <!-- Reset button -->
    <button (click)="togglePathMode(); togglePathMode()"
      style="margin-top:8px; width:100%; background:#eee; border:none;
             border-radius:4px; padding:5px; cursor:pointer; font-size:11px;">
      🔄 Reset Path
    </button>
  </div>

</div>
</div>

@if (isBrowser) {
  <div id="map" style="height: 100vh; width: 100%;"></div>
}
